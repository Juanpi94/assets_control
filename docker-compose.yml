services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assets_control
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host

  nginx:
    image: nginx:latest
    container_name: nginx_assets_control
    ports:
      - "8082:80"  # Mapea el puerto 80 de Nginx al puerto 8082 del host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app